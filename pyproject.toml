[project]
name = "erpforce-indexer"
version = "0.1.0"
description = "Multi-tenant CDC/indexing service — owns the OpenSearch write path for all clients."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "opensearch-py>=2.4.0",
    "redis[asyncio]>=5.0",
    "fastembed>=0.3.0",
    "numpy>=1.24.0",
    "logfire[fastapi]==4.29.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "boto3>=1.34.0",
    "langfuse>=2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.logfire]
# Suppress "not configured" warnings when registry/utility code logs outside the
# running service (tests, scripts/gen_debezium.py). main.py calls logfire.configure().
ignore_no_config = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["indexer*"]
